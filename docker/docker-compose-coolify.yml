name: raopoc

services:
  # Application - serves both React frontend and NestJS API
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"  # Expose port for Coolify's Traefik to route to
    command: sh -c "cd /app && pnpm exec prisma migrate deploy && cd /app/server/dist && node main.js"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database configuration
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      # Redis configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # API URL for frontend - use Coolify's generated FQDN
      API_URL: /api
      # Session secret
      SESSION_SECRET: ${SESSION_SECRET}
      # Encryption key for PII
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Add Coolify's domain to CORS
      COOLIFY_URL: https://${SERVICE_FQDN_APP_3000}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s