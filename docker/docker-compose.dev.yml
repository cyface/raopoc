services:
  # Redis service for development
  redis:
    image: redis:7-alpine
    container_name: raopoc-redis-dev
    ports:
      - "6381:6379"
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Development configuration - mounts source code for hot reload
  app-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: raopoc-app-dev
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - VITE_CONFIG_CACHE_TIMEOUT=5000
    volumes:
      # Mount source code for hot reload
      - ../src:/app/src
      - ../server:/app/server
      - ../public:/app/public
      - ../config:/app/config
      - ../translations:/app/translations
      - ../applications:/app/applications
      - ../index.html:/app/index.html
      - ../vite.config.ts:/app/vite.config.ts
      - ../tsconfig.json:/app/tsconfig.json
      - ../server/tsconfig.json:/app/server/tsconfig.json
      # Exclude node_modules
      - /app/node_modules
      - /app/server/node_modules
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: pnpm run dev

volumes:
  redis-data:
    driver: local