name: raopoc

services:
  # PostgreSQL database for development
  postgres:
    image: postgres:16-alpine
    container_name: raopoc-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raopoc_dev}
      POSTGRES_USER: ${POSTGRES_USER:-raopoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raopoc123}
    ports:
      - "5434:5432"  # Non-standard port for development
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raopoc}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis service for development
  redis:
    image: redis:7-alpine
    container_name: raopoc-redis-dev
    ports:
      - "6381:6379"
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Development configuration - mounts source code for hot reload
  app-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: raopoc-app-dev
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-raopoc}:${POSTGRES_PASSWORD:-raopoc123}@postgres:5432/${POSTGRES_DB:-raopoc_dev}
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-development-session-secret}
      - VITE_CONFIG_CACHE_TIMEOUT=5000
    volumes:
      # Mount source code for hot reload
      - ../src:/app/src
      - ../server:/app/server
      - ../public:/app/public
      - ../config:/app/config
      - ../translations:/app/translations
      - ../applications:/app/applications
      - ../prisma:/app/prisma
      - ../scripts:/app/scripts
      # Mount configuration files
      - ../index.html:/app/index.html
      - ../vite.config.ts:/app/vite.config.ts
      - ../tsconfig.json:/app/tsconfig.json
      - ../tsconfig.server.json:/app/tsconfig.server.json
      - ../package.json:/app/package.json
      - ../pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ../pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ../eslint.config.js:/app/eslint.config.js
      # Mount server-specific configs
      - ../server/tsconfig.json:/app/server/tsconfig.json
      - ../server/nest-cli.json:/app/server/nest-cli.json
      - ../server/package.json:/app/server/package.json
      # Mount any .env files if they exist
      - ../.env:/app/.env:ro
      - ../.env.development:/app/.env.development:ro
      - ../.env.local:/app/.env.local:ro
      # Exclude node_modules
      - /app/node_modules
      - /app/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "pnpm prisma generate --no-hints && pnpm prisma migrate deploy && pnpm run dev"

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local