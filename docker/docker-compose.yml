name: raopoc

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: raopoc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"  # Non-standard port to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - raopoc-network

  # PgBouncer connection pooler
  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: raopoc-pgbouncer
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      PGBOUNCER_DATABASE: ${POSTGRES_DB}
      PGBOUNCER_PORT: 6432
      PGBOUNCER_MAX_CLIENT_CONN: 100
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_POOL_MODE: session
    ports:
      - "6433:6432"  # Non-standard port to avoid conflicts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - raopoc-network

  # Redis for session management
  redis:
    image: redis:7-alpine
    container_name: raopoc-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"  # Non-standard port to avoid conflicts
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - raopoc-network

  # Application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: raopoc-app
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database configuration
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      # Redis configuration
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # API URL for frontend
      API_URL: ${API_URL:-https://app.localhost/api}
      # Session secret
      SESSION_SECRET: ${SESSION_SECRET}
      # Encryption key for PII
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - raopoc-network

  # Caddy web server for HTTPS and reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: raopoc-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - ../dist:/srv/app:ro  # Serve static files
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Cache control based on environment variables
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_MAX_AGE: ${CACHE_MAX_AGE:-3600}
      CACHE_STALE_WHILE_REVALIDATE: ${CACHE_STALE_WHILE_REVALIDATE:-86400}
    depends_on:
      - app
    networks:
      - raopoc-network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  raopoc-network:
    driver: bridge